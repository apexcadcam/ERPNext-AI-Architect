[project]
name = "erpnext-ai-architect"
version = "0.1.0"
description = "Core Runtime Platform for ERPNext AI Architect — the module-agnostic execution substrate every future module (Crawler, Extractor, Validator, Studio, ...) plugs into."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
dependencies = [
    "typer>=0.12",
    "pydantic>=2.6",
    "PyYAML>=6.0",
]

[project.scripts]
architect = "runtime.cli:main"

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-cov>=5.0",
    "ruff>=0.6",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = [
    "runtime",
    "knowledge",
    "plugins",
    "secrets_management",
    "integration",
    "analysis",
    "intelligence",
    "planning",
    "execution",
    "orchestration",
    "composition_root",
    "discovery",
    "synthesis",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"

[tool.mypy]
python_version = "3.11"
strict = true

[tool.ruff]
line-length = 110
target-version = "py311"

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F"]

[tool.ruff.format]
quote-style = "double"
