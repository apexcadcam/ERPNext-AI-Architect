title: "Core Isolation & Non-Invasive Extension"
source_file: "rules/R001-core-isolation-non-invasive-extension.md"
version: "1.0.0"
status: Stable
sync_state: synced
source_content_hash: "sha256:1aa0b045ce7b0e51cfc399c291a3125d40cc38d48b1d43d7298f1d130263a10b"
risk_level: Critical
priority: P0

category: Architecture
tags: [core-isolation, upgrade-safety, extension-points, hooks]
keywords:
  - hand-edited core file
  - vendor app modification
  - bench update overwrite
  - apps/frappe
  - apps/erpnext
  - doc_events
  - override_doctype_class
  - override_whitelisted_methods
  - Custom Field
  - Property Setter

intent: "Keep every customization discoverable in a git diff of one custom app, and survivable across any future bench update."
problem_statement: "A change is about to be made to a DocType, field, or behavior that ships inside frappe, erpnext, or any other vendor app."

requirements:
  - id: "R001-REQ-1"
    modal: MUST_NOT
    statement: "Never modify a file inside apps/frappe, apps/erpnext, or any other vendor app."
    source_anchor: "#rule"
  - id: "R001-REQ-2"
    modal: MUST
    statement: "Apply every customization (field, validation, UI change, business rule) inside a custom app, through an official extension point: Custom Field, Property Setter, Client Script, Server Script, hooks.py (doc_events, override_doctype_class, override_whitelisted_methods), or a genuinely new Custom DocType."
    source_anchor: "#rule"

good_examples:
  - source_anchor: "#good-pattern"
    description: "hooks.py doc_events wiring a validate handler into a custom app instead of editing the vendor doctype file."

bad_examples:
  - source_anchor: "#bad-pattern"
    description: "Hand-edited apps/erpnext/erpnext/crm/doctype/contact/contact.py adding a frappe.throw() directly in core."

anti_patterns: []
exceptions_present: false
related_rules: ["R002", "R003"]

dependencies: []

conflicts:
  - rule_id: "R002"
    scenario: "The only close native fit for a requirement is a vendor-shipped DocType whose behavior can only be adjusted by touching its shipped Python file directly, tempting a core edit in the name of 'native-first.'"
    resolution: "R001 always wins. R002's discovery mandate never overrides R001 — the correct move is the same file's own Good Pattern: reach the vendor DocType only through Custom Field, Property Setter, or hooks.py, never a direct edit, even when no non-invasive path looks like a perfect fit."

