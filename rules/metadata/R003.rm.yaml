intent: "Minimize the amount of bespoke code owned for the app's lifetime by exhausting native configuration primitives first."
problem_statement: "A new feature or behavior is being designed and custom Python/JS logic is being considered before configuration has been ruled out."

requirements:
  - id: "R003-REQ-1"
    modal: MUST
    statement: "Try and rule out Frappe's no-code/low-code primitives (Property Setter, Custom Field, Client Script, Server Script, Workflow, Print Format Builder, Report Builder, Notification, Assignment Rule) before writing a custom Python module, whitelisted API, or custom page."
    source_anchor: "#rule"
  - id: "R003-REQ-2"
    modal: MUST
    statement: "Treat custom code as the last resort, not the default starting point."
    source_anchor: "#rule"

good_examples:
  - source_anchor: "#good-pattern"
    description: "Approval flow modeled as a Workflow with states/transitions/role-based actions, plus Client Script depends_on/fetch_from/set_query for field behavior."

bad_examples:
  - source_anchor: "#bad-pattern"
    description: "Custom @frappe.whitelist() endpoint plus a hand-rolled JS page reimplementing what the Workflow doctype already does."

