title: "Idempotent, Upgrade-Safe Deployment"
source_file: "rules/R005-idempotent-upgrade-safe-deployment.md"
version: "1.0.0"
status: Stable
sync_state: synced
source_content_hash: "sha256:c747bf79d9ee36164f52b9998d4972819018a6ed1f2a2855df0061c9ee39acff"
risk_level: High
priority: P1

category: Deployment
tags: [idempotency, installation, migration, permissions]
keywords:
  - after_install
  - required_apps
  - is_standard report
  - silent install failure
  - partial provisioning failure
  - role assignment overwritten

intent: "Make installation and migration survive partial failure and repeated runs without corrupting state or silently reverting admin changes."
problem_statement: "An after_install or migration hook, a cross-app dependency, or a shipped Report/permission set is being written for a custom app."

requirements:
  - id: "R005-REQ-1"
    modal: MUST
    statement: "Wrap each provisioning step inside after_install (and any migration hook) in its own try/except, never one monolithic uncaught block."
    source_anchor: "#rule"
  - id: "R005-REQ-2"
    modal: MUST
    statement: "Explicitly declare required_apps in hooks.py for any cross-app dependency."
    source_anchor: "#rule"
  - id: "R005-REQ-3"
    modal: MUST
    statement: "Ship Reports and permission sets as UI-managed: is_standard 'No' and an empty roles list, imported once via after_install, with role assignment left to the site administrator."
    source_anchor: "#rule"

good_examples:
  - source_anchor: "#good-pattern"
    description: "after_install looping over provisioning steps with per-step try/except and frappe.log_error, plus required_apps declared in hooks.py."

bad_examples:
  - source_anchor: "#bad-pattern"
    description: "after_install running create_custom_fields/import_reports/setup_workflows with no per-step error isolation, and a report JSON hard-coding is_standard 'Yes' with baked-in roles."

