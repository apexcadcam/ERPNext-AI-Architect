risk_level: Critical
priority: P0

category: Deployment
tags: [reproducibility, fixtures, patches, git]
keywords:
  - bench export-fixtures
  - patches.txt
  - db_update
  - bench console one-off script
  - clean database rebuild
  - gunicorn master reload
  - SIGHUP

intent: "Make an app's entire state reconstructable from git alone, with no undocumented manual step required."
problem_statement: "A UI-driven configuration change or a change touching existing data is being made, or an app/process is being deployed."

requirements:
  - id: "R006-REQ-1"
    modal: MUST
    statement: "Export every Custom Field/Property Setter/Workflow/Workspace created through the UI as a fixture before commit."
    source_anchor: "#rule"
  - id: "R006-REQ-2"
    modal: MUST
    statement: "Ship every change that touches existing data as an idempotent Patch (patches.txt, using db_update()), never as a one-off bench console script or a manual DB edit."
    source_anchor: "#rule"
  - id: "R006-REQ-3"
    modal: MUST
    statement: "Ensure the system behaves identically after a clean bench get-app + bench install-app + bench migrate from an empty database as it did before."
    source_anchor: "#rule"

good_examples:
  - source_anchor: "#good-pattern"
    description: "patches.txt entry plus an idempotent execute() patch using db_update(), with every UI-created fixture exported in the same commit."

bad_examples:
  - source_anchor: "#bad-pattern"
    description: "A Custom Field added through the desk UI with no bench export-fixtures run, live data corrected via a throwaway bench console snippet, and a gunicorn master reloaded with SIGHUP instead of a full restart after new app code is installed."

