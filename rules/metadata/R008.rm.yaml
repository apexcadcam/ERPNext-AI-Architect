intent: "Keep access control visible in Frappe's own permission UI instead of buried in bespoke Python only a developer can audit."
problem_statement: "Access control — including row-level ('see only your own records') visibility — is being implemented for a DocType in a custom app."

requirements:
  - id: "R008-REQ-1"
    modal: MUST
    statement: "Build access control, including row-level security, with Frappe's Role Permission Manager and User Permission doctype, not hand-written checks scattered through validate/has_permission hooks."
    source_anchor: "#rule"
  - id: "R008-REQ-2"
    modal: MUST_NOT
    statement: "Hard-code role assignment into application code; roles are assigned and adjusted through the UI/fixtures."
    source_anchor: "#rule"

good_examples:
  - source_anchor: "#good-pattern"
    description: "A record linked to a user, restricted via a User Permission record, applied automatically everywhere by Frappe's built-in permission engine."

bad_examples:
  - source_anchor: "#bad-pattern"
    description: "A bespoke has_permission() function comparing doc.commission_agent to the logged-in user's linked agent record."

