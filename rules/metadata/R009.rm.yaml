risk_level: Medium
priority: P2

category: Architecture
tags: [yagni, premature-optimization, speculative-infrastructure]
keywords:
  - caching layer
  - generic strategy pattern
  - unmeasured performance concern
  - EXPLAIN query plan
  - load test
  - we might need it later

intent: "Prevent permanent maintenance cost from infrastructure built for a problem that has not been measured or confirmed."
problem_statement: "New infrastructure (a caching layer, a generic abstraction, a strategy layer) is being proposed to address a performance or flexibility concern."

requirements:
  - id: "R009-REQ-1"
    modal: MUST_NOT
    statement: "Do not build caching layers, generic scope/strategy abstractions, or any infrastructure to solve a performance or flexibility problem that has not been measured and proven to exist."
    source_anchor: "#rule"
  - id: "R009-REQ-2"
    modal: MUST
    statement: "Justify every piece of infrastructure by a real, observed bottleneck or a concrete, already-confirmed requirement, never by 'we might need it later.'"
    source_anchor: "#rule"

good_examples:
  - source_anchor: "#good-pattern"
    description: "Straightforward implementation shipped first; optimization infrastructure considered only after EXPLAIN or a load test against production-scale data confirms a real bottleneck."

bad_examples:
  - source_anchor: "#bad-pattern"
    description: "A summary-cache table built 'in case the query gets slow at scale' before any query has been measured, or a generic strategy-pattern layer for hypothetical future variants nobody requested."

